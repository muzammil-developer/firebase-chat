<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Firebase Chat App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary px-3">
      <span class="navbar-brand mb-0 h1">Firebase Chat</span>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span id="current-user-name" class="text-white fw-semibold">User</span>
        <button type="button" id="logout-btn" class="btn btn-danger btn-sm">
          Logout
        </button>
      </div>
    </nav>

    <div class="dashboard-wrapper">
      <div id="dashboard-container" class="dashboard-container hidden">
        <!-- Left Sidebar: Registered Users -->
        <aside class="sidebar">
          <div class="users-title">Registered Users</div>
          <div id="users-list" class="users-list"></div>
        </aside>

        <!-- Right Side: Chat Window -->
        <main class="chat-area">
          <div id="no-chat-selected" class="no-chat-selected">
            Select a user to start chatting
          </div>

          <div id="chat-window" class="chat-window hidden">
            <div id="chat-header" class="chat-header"></div>
            <div id="chat-box"></div>
            <form id="chat-form">
              <input
                type="text"
                id="message-input"
                class="form-control"
                placeholder="Type a message..."
                autocomplete="off"
                required
              />
              <button type="submit" id="send-btn" class="btn btn-primary">
                Send
              </button>
            </form>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
