<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Firebase Chat App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary px-3">
      <span class="navbar-brand mb-0 h1">Firebase Chat</span>
    </nav>

    <div class="auth-wrapper">
      <div class="card shadow-sm auth-container">
        <div class="card-body p-4">
          <form id="signup-form" class="d-flex flex-column gap-3">
            <h2 class="h4 text-center mb-1">Sign Up</h2>
            <input
              type="text"
              id="signup-name"
              class="form-control"
              placeholder="Full Name"
              required
            />
            <input
              type="email"
              id="signup-email"
              class="form-control"
              placeholder="Email"
              required
            />
            <input
              type="password"
              id="signup-password"
              class="form-control"
              placeholder="Password (min 6 characters)"
              minlength="6"
              required
            />
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            <p class="text-center text-muted small mb-0">
              Already have an account?
              <a href="./login.html">Login</a>
            </p>
          </form>
          <p id="auth-error" class="text-danger small text-center mt-3 mb-0 hidden"></p>
        </div>
      </div>
    </div>

    <script type="module" src="./signup.js"></script>
  </body>
</html>
